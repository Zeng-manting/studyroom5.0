# ============================================================
# 生产环境配置（敏感项通过环境变量注入，不入库）
# ============================================================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${STUDYROOM_DB_URL:jdbc:mysql://127.0.0.1:3306/studyroom?useUnicode=true&characterEncoding=utf8mb4&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${STUDYROOM_DB_USER:studyroom}
    password: ${STUDYROOM_DB_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat,wall
      # 生产环境关闭监控页面（可观测性：Knife4j/Druid 均不对公网开放）
      stat-view-servlet:
        enabled: false

  redis:
    host: ${STUDYROOM_REDIS_HOST:127.0.0.1}
    port: ${STUDYROOM_REDIS_PORT:6379}
    password: ${STUDYROOM_REDIS_PASSWORD:}
    database: 0
    timeout: 5000
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
        max-wait: 3000

  mail:
    host: ${STUDYROOM_MAIL_HOST:smtp.qq.com}
    port: 465
    username: ${STUDYROOM_MAIL_USER:}
    password: ${STUDYROOM_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# 生产环境关闭接口文档
knife4j:
  enable: false

# 生产环境覆盖 JWT 密钥
studyroom:
  jwt:
    secret: ${STUDYROOM_JWT_SECRET}
  cors:
    # 生产由 Nginx 统一代理，收紧来源
    allowed-origins: ${STUDYROOM_CORS_ORIGINS:}

logging:
  level:
    com.studyroom: info
